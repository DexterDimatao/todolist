<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <div class="todo-container">
    <h2>📝 To-Do List</h2>
    <p class="todo-subtitle">Add tasks, then edit or delete them as you go.</p>

    <!-- Input area -->
    <div class="mb-3">
      <label for="todoInput" class="form-label fw-semibold">New task</label>
      <textarea class="form-control mb-2" id="todoInput" placeholder="Example: Finish UI mockups for portfolio..." rows="2"></textarea>
      <div class="d-flex justify-content-between align-items-center">
        <small class="text-muted">Press Enter or click "Add Task".</small>
        <button class="btn btn-add" id="addButton">Add Task</button>
      </div>
    </div>

    <!-- Task filter / info -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="task-meta" id="taskCount">0 tasks</span>
      <div class="btn-group btn-group-sm" role="group" aria-label="Filter tasks">
        <button type="button" class="btn btn-outline-secondary active" id="filterAll">All</button>
        <button type="button" class="btn btn-outline-secondary" id="filterActive">Active</button>
        <button type="button" class="btn btn-outline-secondary" id="filterCompleted">Completed</button>
      </div>
    </div>

    <!-- Task list -->
    <ul id="todoList" class="list-group mb-2"></ul>
    <p class="empty-state d-none" id="emptyStateText">No tasks yet. Add your first task above.</p>
  </div>

  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
