<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f4f6f9;
      font-family: Arial, sans-serif;
    }
    .auth-container, .todo-container {
      max-width: 400px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .todo-container {
      max-width: 600px;
      padding: 25px 30px;
    }
    h2 {
      text-align: center;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .todo-subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 20px;
    }
    .btn-primary-custom {
      background-color: #4f46e5;
      border-color: #4f46e5;
    }
    .btn-primary-custom:hover {
      background-color: #4338ca;
      border-color: #4338ca;
    }
    .btn-add {
      background-color: #4f46e5;
      color: white;
      min-width: 110px;
    }
    .btn-add:hover {
      background-color: #4338ca;
    }
    textarea {
      resize: none;
    }
    .list-group-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .task-text {
      flex: 1;
      margin: 0;
      word-break: break-word;
    }
    .task-text.completed {
      text-decoration: line-through;
      color: #9ca3af;
    }
    .task-meta {
      font-size: 0.8rem;
      color: #6b7280;
    }
    .btn-group-sm .btn {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
    }
    .empty-state {
      text-align: center;
      color: #9ca3af;
      font-size: 0.9rem;
      margin-top: 10px;
    }
    #todoSection {
      display: none;
    }
    #userGreeting {
      font-weight: 500;
      color: #4f46e5;
    }
    .activity-item {
      font-size: 0.85rem;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .activity-time {
      color: #6b7280;
      font-size: 0.75rem;
    }
  </style>
</head>

<body>
  <!-- Login Section -->
  <div id="loginSection" class="auth-container">
    <h2>👤 Login</h2>
    <p class="todo-subtitle">Enter any username to access your personal To-Do List.</p>
    <div class="mb-3">
      <label for="username" class="form-label fw-semibold">Username</label>
      <input type="text" class="form-control" id="username" placeholder="Enter any username (e.g. john123)">
    </div>
    <button class="btn btn-primary-custom w-100" id="loginButton">Login</button>
  </div>

  <!-- To-Do List Section -->
  <div id="todoSection">
    <div class="todo-container">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2>📝 <span id="userGreeting"></span>'s To-Do List</h2>
        </div>
        <button class="btn btn-outline-secondary btn-sm" id="logoutButton">Logout</button>
      </div>
      <p class="todo-subtitle">Add tasks, then edit or delete them as you go.</p>

      <!-- Input area -->
      <div class="mb-3">
        <label for="todoInput" class="form-label fw-semibold">New task</label>
        <textarea class="form-control mb-2" id="todoInput" placeholder="Example: Finish UI mockups for portfolio..." rows="2"></textarea>
        <div class="d-flex justify-content-between align-items-center">
          <small class="text-muted">Press Enter or click "Add Task".</small>
          <button class="btn btn-add" id="addButton">Add Task</button>
        </div>
      </div>

      <!-- Task filter / info -->
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="task-meta" id="taskCount">0 tasks</span>
        <div class="btn-group btn-group-sm" role="group" aria-label="Filter tasks">
          <button type="button" class="btn btn-outline-secondary active" id="filterAll">All</button>
          <button type="button" class="btn btn-outline-secondary" id="filterActive">Active</button>
          <button type="button" class="btn btn-outline-secondary" id="filterCompleted">Completed</button>
        </div>
      </div>

      <!-- Task list -->
      <ul id="todoList" class="list-group mb-2"></ul>
      <p class="empty-state d-none" id="emptyStateText">No tasks yet. Add your first task above.</p>

      <!-- Activity Log -->
      <div class="mt-4">
        <h6 class="fw-semibold mb-2">📊 Recent Activity</h6>
        <div id="activityLog" class="border p-3 bg-light" style="max-height: 150px; overflow-y: auto;">
          <div class="activity-item text-muted">Welcome! Activity log starts here.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- All JavaScript embedded here -->
  <script>
    // User data storage
    const userData = {};

    // Login functionality
    const loginSection = document.getElementById('loginSection');
    const todoSection = document.getElementById('todoSection');
    const loginButton = document.getElementById('loginButton');
    const logoutButton = document.getElementById('logoutButton');
    const usernameInput = document.getElementById('username');
    const userGreeting = document.getElementById('userGreeting');
    const activityLog = document.getElementById('activityLog');

    let currentUser = '';

    function loadUserData(username) {
      if (!userData[username]) {
        userData[username] = {
          tasks: [],
          activity: []
        };
      }
      return userData[username];
    }

    function addActivity(username, message) {
      const data = loadUserData(username);
      const timestamp = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      const activity = {
        message,
        time: timestamp
      };
      data.activity.unshift(activity); // Add to beginning
      if (data.activity.length > 10) {
        data.activity = data.activity.slice(0, 10); // Keep only last 10
      }
      updateActivityLog();
    }

    function updateActivityLog() {
      activityLog.innerHTML = '';
      const data = loadUserData(currentUser);
      if (data.activity.length === 0) {
        activityLog.innerHTML = '<div class="activity-item text-muted">No activity yet.</div>';
        return;
      }
      data.activity.forEach(item => {
        const div = document.createElement('div');
        div.className = 'activity-item';
        div.innerHTML = `<div>${item.message}</div><div class="activity-time">${item.time}</div>`;
        activityLog.appendChild(div);
      });
    }

    function saveTasksLocally() {
      localStorage.setItem('todoAppUsers', JSON.stringify(userData));
    }

    function loadTasksLocally() {
      const saved = localStorage.getItem('todoAppUsers');
      if (saved) {
        Object.assign(userData, JSON.parse(saved));
      }
    }

    // Load saved data on page load
    loadTasksLocally();

    loginButton.addEventListener('click', () => {
      const username = usernameInput.value.trim();
      if (username) {
        currentUser = username;
        userGreeting.textContent = currentUser;
        
        const userDataObj = loadUserData(currentUser);
        addActivity(currentUser, `👋 ${currentUser} logged in`);
        saveTasksLocally();
        
        loginSection.style.display = 'none';
        todoSection.style.display = 'block';
        usernameInput.value = '';
        input.focus();
        updateActivityLog();
      }
    });

    usernameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        loginButton.click();
      }
    });

    logoutButton.addEventListener('click', () => {
      addActivity(currentUser, `👋 ${currentUser} logged out`);
      saveTasksLocally();
      currentUser = '';
      loginSection.style.display = 'block';
      todoSection.style.display = 'none';
      list.innerHTML = '';
      updateTaskCount();
    });

    // To-Do List functionality
    const input = document.getElementById('todoInput');
    const addButton = document.getElementById('addButton');
    const list = document.getElementById('todoList');
    const taskCount = document.getElementById('taskCount');
    const emptyStateText = document.getElementById('emptyStateText');

    const filterAll = document.getElementById('filterAll');
    const filterActive = document.getElementById('filterActive');
    const filterCompleted = document.getElementById('filterCompleted');

    let currentFilter = 'all';
    let taskIdCounter = 0;

    function updateTaskCount() {
      const total = list.querySelectorAll('li').length;
      taskCount.textContent = total === 1 ? '1 task' : total + ' tasks';
      emptyStateText.classList.toggle('d-none', total !== 0);
    }

    function applyFilter() {
      const items = list.querySelectorAll('li');
      items.forEach(li => {
        const isCompleted = li.classList.contains('task-completed');
        if (currentFilter === 'all') {
          li.classList.remove('d-none');
        } else if (currentFilter === 'active') {
          li.classList.toggle('d-none', isCompleted);
        } else if (currentFilter === 'completed') {
          li.classList.toggle('d-none', !isCompleted);
        }
      });
    }

    function setFilter(filter) {
      currentFilter = filter;
      [filterAll, filterActive, filterCompleted].forEach(btn => btn.classList.remove('active'));
      if (filter === 'all') filterAll.classList.add('active');
      if (filter === 'active') filterActive.classList.add('active');
      if (filter === 'completed') filterCompleted.classList.add('active');
      applyFilter();
    }

    function loadUserTasks() {
      list.innerHTML = '';
      const data = loadUserData(currentUser);
      data.tasks.forEach(taskData => {
        const li = document.createElement('li');
        li.className = `list-group-item ${taskData.completed ? 'task-completed' : ''}`;
        li.dataset.taskId = taskData.id;

        const left = document.createElement('div');
        left.className = 'd-flex align-items-start gap-2';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'form-check-input mt-1';
        checkbox.checked = taskData.completed;

        const p = document.createElement('p');
        p.className = `task-text mb-0 ${taskData.completed ? 'completed' : ''}`;
        p.textContent = taskData.text;

        left.appendChild(checkbox);
        left.appendChild(p);

        const btnGroup = document.createElement('div');
        btnGroup.className = 'btn-group btn-group-sm';
        btnGroup.role = 'group';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'btn btn-outline-primary';
        editBtn.textContent = 'Edit';

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'btn btn-outline-danger';
        deleteBtn.textContent = 'Delete';

        btnGroup.appendChild(editBtn);
        btnGroup.appendChild(deleteBtn);

        li.appendChild(left);
        li.appendChild(btnGroup);
        list.appendChild(li);

        // Restore events
        checkbox.addEventListener('change', () => toggleTaskComplete(li, taskData));
        deleteBtn.addEventListener('click', () => deleteTask(li, taskData));
        editBtn.addEventListener('click', () => editTask(li, taskData));
      });
      updateTaskCount();
      applyFilter();
    }

    function addTask(text) {
      if (!text.trim()) return;

      const data = loadUserData(currentUser);
      const taskData = {
        id: ++taskIdCounter,
        text: text.trim(),
        completed: false,
        createdAt: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
      };
      data.tasks.push(taskData);
      addActivity(currentUser, `➕ Added task: "${text.trim().substring(0, 30)}${text.trim().length > 30 ? '...' : ''}"`);
      saveTasksLocally();
      loadUserTasks();
      input.value = '';
      input.focus();
    }

    function toggleTaskComplete(li, taskData) {
      const data = loadUserData(currentUser);
      taskData.completed = !taskData.completed;
      const action = taskData.completed ? '✅ Completed' : '🔄 Marked incomplete';
      addActivity(currentUser, `${action}: "${taskData.text.substring(0, 30)}${taskData.text.length > 30 ? '...' : ''}"`);
      saveTasksLocally();
      loadUserTasks();
    }

    function deleteTask(li, taskData) {
      const data = loadUserData(currentUser);
      data.tasks = data.tasks.filter(task => task.id !== taskData.id);
      addActivity(currentUser, `🗑️ Deleted task: "${taskData.text.substring(0, 30)}${taskData.text.length > 30 ? '...' : ''}"`);
      saveTasksLocally();
      loadUserTasks();
    }

    function editTask(li, taskData) {
      const newText = prompt('Edit task:', taskData.text);
      if (newText !== null && newText.trim() !== '' && newText.trim() !== taskData.text) {
        const data = loadUserData(currentUser);
        taskData.text = newText.trim();
        addActivity(currentUser, `✏️ Edited task: "${newText.trim().substring(0, 30)}${newText.trim().length > 30 ? '...' : ''}"`);
        saveTasksLocally();
        loadUserTasks();
      }
    }

    addButton.addEventListener('click', () => addTask(input.value));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        addTask(input.value);
      }
    });

    filterAll.addEventListener('click', () => setFilter('all'));
    filterActive.addEventListener('click', () => setFilter('active'));
    filterCompleted.addEventListener('click', () => setFilter('completed'));

    // Initial state
    updateTaskCount();
  </script>
</body>
</html>
