<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f4f6f9;
      font-family: Arial, sans-serif;
    }
    .auth-container, .todo-container {
      max-width: 400px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .todo-container {
      max-width: 600px;
      padding: 25px 30px;
    }
    h2 {
      text-align: center;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .todo-subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 20px;
    }
    .btn-primary-custom {
      background-color: #4f46e5;
      border-color: #4f46e5;
    }
    .btn-primary-custom:hover {
      background-color: #4338ca;
      border-color: #4338ca;
    }
    .btn-add {
      background-color: #4f46e5;
      color: white;
      min-width: 110px;
    }
    .btn-add:hover {
      background-color: #4338ca;
    }
    textarea {
      resize: none;
    }
    .list-group-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .task-text {
      flex: 1;
      margin: 0;
      word-break: break-word;
    }
    .task-text.completed {
      text-decoration: line-through;
      color: #9ca3af;
    }
    .task-meta {
      font-size: 0.8rem;
      color: #6b7280;
    }
    .btn-group-sm .btn {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
    }
    .empty-state {
      text-align: center;
      color: #9ca3af;
      font-size: 0.9rem;
      margin-top: 10px;
    }
    #todoSection {
      display: none;
    }
    #userGreeting {
      font-weight: 500;
      color: #4f46e5;
    }
  </style>
</head>

<body>
  <!-- Login Section -->
  <div id="loginSection" class="auth-container">
    <h2>👤 Login</h2>
    <p class="todo-subtitle">Enter any username to access your personal To-Do List.</p>
    <div class="mb-3">
      <label for="username" class="form-label fw-semibold">Username</label>
      <input type="text" class="form-control" id="username" placeholder="Enter any username (e.g. john123)">
    </div>
    <button class="btn btn-primary-custom w-100" id="loginButton">Login</button>
  </div>

  <!-- To-Do List Section -->
  <div id="todoSection">
    <div class="todo-container">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2>📝 <span id="userGreeting"></span>'s To-Do List</h2>
        </div>
        <button class="btn btn-outline-secondary btn-sm" id="logoutButton">Logout</button>
      </div>
      <p class="todo-subtitle">Add tasks, then edit or delete them as you go.</p>

      <!-- Input area -->
      <div class="mb-3">
        <label for="todoInput" class="form-label fw-semibold">New task</label>
        <textarea class="form-control mb-2" id="todoInput" placeholder="Example: Finish UI mockups for portfolio..." rows="2"></textarea>
        <div class="d-flex justify-content-between align-items-center">
          <small class="text-muted">Press Enter or click "Add Task".</small>
          <button class="btn btn-add" id="addButton">Add Task</button>
        </div>
      </div>

      <!-- Task filter / info -->
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="task-meta" id="taskCount">0 tasks</span>
        <div class="btn-group btn-group-sm" role="group" aria-label="Filter tasks">
          <button type="button" class="btn btn-outline-secondary active" id="filterAll">All</button>
          <button type="button" class="btn btn-outline-secondary" id="filterActive">Active</button>
          <button type="button" class="btn btn-outline-secondary" id="filterCompleted">Completed</button>
        </div>
      </div>

      <!-- Task list -->
      <ul id="todoList" class="list-group mb-2"></ul>
      <p class="empty-state d-none" id="emptyStateText">No tasks yet. Add your first task above.</p>
    </div>
  </div>

  <!-- All JavaScript embedded here -->
  <script>
    // Login functionality - Random users welcome!
    const loginSection = document.getElementById('loginSection');
    const todoSection = document.getElementById('todoSection');
    const loginButton = document.getElementById('loginButton');
    const logoutButton = document.getElementById('logoutButton');
    const usernameInput = document.getElementById('username');
    const userGreeting = document.getElementById('userGreeting');

    let currentUser = '';

    loginButton.addEventListener('click', () => {
      const username = usernameInput.value.trim();
      if (username) {
        currentUser = username;
        userGreeting.textContent = currentUser;
        loginSection.style.display = 'none';
        todoSection.style.display = 'block';
        usernameInput.value = '';
        usernameInput.focus(); // Focus on todo input after login
      }
    });

    usernameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        loginButton.click();
      }
    });

    logoutButton.addEventListener('click', () => {
      currentUser = '';
      loginSection.style.display = 'block';
      todoSection.style.display = 'none';
      document.getElementById('todoList').innerHTML = ''; // Clear tasks
      updateTaskCount();
    });

    // To-Do List functionality (original code)
    const input = document.getElementById('todoInput');
    const addButton = document.getElementById('addButton');
    const list = document.getElementById('todoList');
    const taskCount = document.getElementById('taskCount');
    const emptyStateText = document.getElementById('emptyStateText');

    const filterAll = document.getElementById('filterAll');
    const filterActive = document.getElementById('filterActive');
    const filterCompleted = document.getElementById('filterCompleted');

    let currentFilter = 'all';

    function updateTaskCount() {
      const total = list.querySelectorAll('li').length;
      taskCount.textContent = total === 1 ? '1 task' : total + ' tasks';
      emptyStateText.classList.toggle('d-none', total !== 0);
    }

    function applyFilter() {
      const items = list.querySelectorAll('li');
      items.forEach(li => {
        const isCompleted = li.classList.contains('task-completed');
        if (currentFilter === 'all') {
          li.classList.remove('d-none');
        } else if (currentFilter === 'active') {
          li.classList.toggle('d-none', isCompleted);
        } else if (currentFilter === 'completed') {
          li.classList.toggle('d-none', !isCompleted);
        }
      });
    }

    function setFilter(filter) {
      currentFilter = filter;
      [filterAll, filterActive, filterCompleted].forEach(btn => btn.classList.remove('active'));
      if (filter === 'all') filterAll.classList.add('active');
      if (filter === 'active') filterActive.classList.add('active');
      if (filter === 'completed') filterCompleted.classList.add('active');
      applyFilter();
    }

    function addTask(text) {
      if (!text.trim()) return;

      const li = document.createElement('li');
      li.className = 'list-group-item';

      const left = document.createElement('div');
      left.className = 'd-flex align-items-start gap-2';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'form-check-input mt-1';

      const p = document.createElement('p');
      p.className = 'task-text mb-0';
      p.textContent = text.trim();

      left.appendChild(checkbox);
      left.appendChild(p);

      const btnGroup = document.createElement('div');
      btnGroup.className = 'btn-group btn-group-sm';
      btnGroup.role = 'group';

      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'btn btn-outline-primary';
      editBtn.textContent = 'Edit';

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'btn btn-outline-danger';
      deleteBtn.textContent = 'Delete';

      btnGroup.appendChild(editBtn);
      btnGroup.appendChild(deleteBtn);

      li.appendChild(left);
      li.appendChild(btnGroup);
      list.appendChild(li);

      // Events
      checkbox.addEventListener('change', () => {
        li.classList.toggle('task-completed', checkbox.checked);
        p.classList.toggle('completed', checkbox.checked);
        applyFilter();
      });

      deleteBtn.addEventListener('click', () => {
        li.remove();
        updateTaskCount();
      });

      editBtn.addEventListener('click', () => {
        const newText = prompt('Edit task:', p.textContent);
        if (newText !== null && newText.trim() !== '') {
          p.textContent = newText.trim();
        }
      });

      updateTaskCount();
      applyFilter();
    }

    addButton.addEventListener('click', () => {
      addTask(input.value);
      input.value = '';
      input.focus();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        addButton.click();
      }
    });

    filterAll.addEventListener('click', () => setFilter('all'));
    filterActive.addEventListener('click', () => setFilter('active'));
    filterCompleted.addEventListener('click', () => setFilter('completed'));

    // Initial state
    updateTaskCount();
  </script>
</body>
</html>
