<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>

  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f4f6f9;
      font-family: Arial, sans-serif;
    }
    .auth-container {
      max-width: 400px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .todo-container {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .todo-subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 20px;
    }
    .btn-primary-custom {
      background-color: #4f46e5;
      border-color: #4f46e5;
    }
    .btn-primary-custom:hover {
      background-color: #4338ca;
      border-color: #4338ca;
    }
    .btn-add {
      background-color: #4f46e5;
      color: white;
      min-width: 110px;
    }
    .btn-add:hover {
      background-color: #4338ca;
    }
    textarea { resize: none; }

    .list-group-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .task-text {
      flex: 1;
      margin: 0;
      word-break: break-word;
    }
    .task-text.completed {
      text-decoration: line-through;
      color: #9ca3af;
    }
    .task-meta {
      font-size: 0.8rem;
      color: #6b7280;
    }
    .btn-group-sm .btn {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
    }
    .empty-state {
      text-align: center;
      color: #9ca3af;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    #todoSection, #allUsersView { display: none; }

    #userGreeting { font-weight: 500; color: #4f46e5; }

    .activity-item {
      font-size: 0.85rem;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .activity-time {
      color: #6b7280;
      font-size: 0.75rem;
    }

    /* You can keep these styles; script will reuse them for single-user “All Todos” */
    .all-users-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .user-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
    }
    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    .user-stats {
      display: flex;
      gap: 15px;
      font-size: 0.85rem;
      color: #64748b;
    }
    .user-tasks {
      max-height: 300px;
      overflow-y: auto;
    }
    .user-task {
      font-size: 0.8rem;
      padding: 6px 8px;
      margin: 2px 0;
      background: white;
      border-radius: 6px;
      border-left: 3px solid #4f46e5;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .user-task.completed {
      opacity: 0.6;
      text-decoration: line-through;
      border-left-color: #10b981;
    }
  </style>
</head>

<body>
  <!-- Login Section -->
  <div id="loginSection" class="auth-container">
    <h2>👤 Login</h2>
    <p class="todo-subtitle">Enter your name to personalize your To-Do List.</p>
    <div class="mb-3">
      <label for="username" class="form-label fw-semibold">Name</label>
      <input type="text" class="form-control" id="username" placeholder="Enter your name" required>
    </div>
    <button class="btn btn-primary-custom w-100" id="loginButton">Login</button>
  </div>

  <!-- Personal To-Do Section -->
  <div id="todoSection" class="todo-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h2>📝 <span id="userGreeting"></span>'s To-Do List</h2>
      </div>
      <button class="btn btn-outline-secondary me-2 btn-sm" id="logoutButton">Logout</button>
      <div class="btn-group btn-group-sm">
        <button class="btn btn-outline-secondary active" id="myTasksBtn">My Tasks</button>
        <button class="btn btn-outline-success" id="allTodosBtn">All Todos</button>
      </div>
    </div>

    <p class="todo-subtitle">Add tasks, then edit or delete them as you go.</p>

    <!-- Personal Task Input -->
    <div id="personalInputArea" class="mb-4">
      <label for="todoInput" class="form-label fw-semibold">New task</label>
      <textarea class="form-control mb-2" id="todoInput" placeholder="Example: Finish UI mockups..." rows="2"></textarea>
      <div class="d-flex justify-content-between align-items-center">
        <small class="text-muted">Press Enter or click "Add Task".</small>
        <button class="btn btn-add" id="addButton">Add Task</button>
      </div>
    </div>

    <!-- Task filter / info -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="task-meta" id="taskCount">0 tasks</span>
      <div class="btn-group btn-group-sm" role="group" aria-label="Filter tasks">
        <button type="button" class="btn btn-outline-secondary active" id="filterAll">All</button>
        <button type="button" class="btn btn-outline-secondary" id="filterActive">Active</button>
        <button type="button" class="btn btn-outline-secondary" id="filterCompleted">Completed</button>
      </div>
    </div>

    <!-- Task list -->
    <ul id="todoList" class="list-group mb-4"></ul>
    <p class="empty-state d-none" id="emptyStateText">No tasks yet. Add your first task above.</p>

    <!-- Activity Log -->
    <div>
      <h6 class="fw-semibold mb-2">📊 Recent Activity</h6>
      <div id="activityLog" class="border p-3 bg-light" style="max-height: 150px; overflow-y: auto;">
        <div class="activity-item text-muted">Welcome! Activity log starts here.</div>
      </div>
    </div>
  </div>

  <!-- All Todos View (SINGLE USER) -->
  <div id="allUsersView" class="todo-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>🗂️ <span id="allTasksName"></span>'s All Tasks</h2>
      <button class="btn btn-outline-secondary btn-sm" id="backToTasksBtn">← Back to My Tasks</button>
    </div>

    <!-- We keep this container but it now shows ONLY the current user's tasks -->
    <div id="allUsersContent" class="all-users-grid"></div>
  </div>

  <!-- Use external JS -->
  <script src="script.js"></script>
</body>
</html>
